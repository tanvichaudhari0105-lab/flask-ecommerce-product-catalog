```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | E-Commerce Catalog</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #0a1d3a;
            color: white;
            padding: 22px 50px;
        }

        header h1 {
            font-size: 26px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            color: #0a1d3a;
            margin-bottom: 8px;
        }

        .form-card p {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5d9df;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #0a1d3a;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .add-btn,
        .cancel-btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn {
            background: #f6c106;
            color: #0a1d3a;
            border: none;
        }

        .cancel-btn {
            background: #e9ecef;
            color: #333;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            .container {
                width: 94%;
            }

            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ E-Commerce Catalog</h1>
</header>

<div class="container">

    <div class="form-card">

        <h2>Add New Product</h2>
        <p>Enter the product details to add it to your catalog.</p>

        <form method="POST">

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name"
                       placeholder="e.g. Wireless Bluetooth Headphones"
                       required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description"
                          placeholder="Enter product description"></textarea>
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price"
                       step="0.01"
                       placeholder="1499"
                       required>
            </div>

            <div class="form-group">
                <label>Stock</label>
                <input type="number" name="stock"
                       placeholder="25"
                       required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" name="category"
                       placeholder="e.g. Electronics"
                       required>
            </div>

            <div class="buttons">
                <a href="/" class="cancel-btn">Cancel</a>
                <button type="submit" class="add-btn">
                    Add Product
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
```
